<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #f8fafc; font-weight: 700; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 500; }
      .ecdf-base { fill: none; stroke: #38bdf8; stroke-width: 3; }
      .ecdf-prod { fill: none; stroke: #f43f5e; stroke-width: 3; }
      .diff-line { stroke: #10b981; stroke-width: 2.5; stroke-dasharray: 3 3; }
    </style>
  </defs>
  <rect width="800" height="320" class="bg"/>
  <text x="30" y="38" class="title">Data Drift &amp; Monitoring in MLOps: KS-Statistik &amp; PSI</text>
  <text x="30" y="58" class="subtext">Erkennung von Covariate Shift in Produktion vor dem Leistungsabfall des Modells</text>

  <!-- Left: ECDF & KS-Statistic -->
  <g transform="translate(50, 85)">
    <text x="140" y="15" class="label" fill="#38bdf8" font-weight="700" text-anchor="middle">Kolmogorov-Smirnov (KS) Test</text>
    
    <!-- Axes -->
    <line x1="30" y1="180" x2="270" y2="180" stroke="#334155" stroke-width="1.5"/>
    <line x1="30" y1="180" x2="30" y2="30" stroke="#334155" stroke-width="1.5"/>
    <text x="15" y="35" class="subtext">1.0</text>
    <text x="15" y="185" class="subtext">0.0</text>

    <!-- Baseline ECDF (Blue) -->
    <path d="M 30 180 Q 70 180, 110 130 Q 150 70, 200 40 L 260 35" class="ecdf-base"/>
    
    <!-- Production ECDF with Shift (Red) -->
    <path d="M 30 180 Q 120 180, 160 145 Q 200 90, 240 45 L 260 35" class="ecdf-prod"/>

    <!-- Max Distance D -->
    <line x1="120" y1="115" x2="120" y2="175" class="diff-line"/>
    <circle cx="120" cy="115" r="4" fill="#10b981"/>
    <circle cx="120" cy="175" r="4" fill="#10b981"/>
    <text x="130" y="150" class="label" fill="#10b981" font-weight="700">Max D</text>

    <!-- Legend -->
    <circle cx="50" cy="205" r="5" fill="#38bdf8"/> <text x="62" y="209" class="subtext">Baseline (Training)</text>
    <circle cx="160" cy="205" r="5" fill="#f43f5e"/> <text x="172" y="209" class="subtext">Produktion (Shift!)</text>
  </g>

  <!-- Right: PSI Metric & Traffic Light Rules -->
  <g transform="translate(400, 90)">
    <rect x="0" y="0" width="350" height="185" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="28" class="label" fill="#f8fafc" font-weight="700" font-size="14px">Population Stability Index (PSI):</text>
    
    <!-- Formula -->
    <rect x="25" y="40" width="300" height="32" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="175" y="61" class="label" fill="#38bdf8" font-size="11px" font-weight="700" text-anchor="middle">PSI = Σ (Actual - Expected) · ln(Actual / Expected)</text>

    <!-- Traffic Lights -->
    <g transform="translate(25, 85)">
      <rect x="0" y="0" width="16" height="16" rx="8" fill="#10b981"/>
      <text x="26" y="13" class="label" font-size="12px"><tspan font-weight="700">PSI &lt; 0.10:</tspan> Kein Drift (Modell stabil)</text>
    </g>
    <g transform="translate(25, 115)">
      <rect x="0" y="0" width="16" height="16" rx="8" fill="#f59e0b"/>
      <text x="26" y="13" class="label" font-size="12px"><tspan font-weight="700">0.10 ≤ PSI ≤ 0.25:</tspan> Moderater Drift (Warnung)</text>
    </g>
    <g transform="translate(25, 145)">
      <rect x="0" y="0" width="16" height="16" rx="8" fill="#f43f5e"/>
      <text x="26" y="13" class="label" font-size="12px"><tspan font-weight="700">PSI &gt; 0.25:</tspan> Kritischer Drift (Retraining nötig!)</text>
    </g>
  </g>
</svg>
