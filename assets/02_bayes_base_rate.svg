<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #f8fafc; font-weight: 700; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 500; }
      .label-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; }
      .box-tp { fill: #10b981; fill-opacity: 0.25; stroke: #10b981; stroke-width: 2; }
      .box-fp { fill: #f43f5e; fill-opacity: 0.25; stroke: #f43f5e; stroke-width: 2; }
      .box-fn { fill: #64748b; fill-opacity: 0.15; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 3 3; }
      .box-tn { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="800" height="320" class="bg"/>
  <text x="30" y="38" class="title">Satz von Bayes &amp; Base-Rate Fallacy (Prävalenzfehler)</text>
  <text x="30" y="58" class="subtext">Warum bei seltenen Ereignissen (Betrug / seltene Krankheiten) die meisten Alarme falsch sind</text>

  <!-- Left: Population Bar -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="220" height="180" rx="8" class="box-tn"/>
    <rect x="0" y="0" width="220" height="20" rx="4" fill="#0284c7" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="110" y="14" class="label-bold" fill="#38bdf8" text-anchor="middle">1% Betrug (Prior P(A) = 0.01)</text>
    <text x="110" y="105" class="label" fill="#94a3b8" text-anchor="middle">99% Kein Betrug</text>
    <text x="110" y="125" class="subtext" text-anchor="middle">(9.900 von 10.000 Transaktionen)</text>
    <text x="110" y="170" class="subtext" text-anchor="middle">Grundgesamtheit: 10.000 Fälle</text>
  </g>

  <!-- Arrow -->
  <path d="M 285 180 L 330 180" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="307" y="170" class="subtext" text-anchor="middle">ML-Modell</text>
  <text x="307" y="195" class="subtext" text-anchor="middle">(95% Acc)</text>

  <!-- Right: Alarm Outcome -->
  <g transform="translate(360, 90)">
    <rect x="0" y="0" width="390" height="180" rx="8" class="box-tn"/>
    
    <!-- True Positives -->
    <rect x="20" y="25" width="100" height="60" rx="6" class="box-tp"/>
    <text x="70" y="52" class="label-bold" fill="#10b981" text-anchor="middle">95 Alarme</text>
    <text x="70" y="70" class="subtext" fill="#10b981" text-anchor="middle">Echte Fälle (TP)</text>

    <!-- False Positives -->
    <rect x="140" y="25" width="225" height="60" rx="6" class="box-fp"/>
    <text x="252" y="52" class="label-bold" fill="#f43f5e" text-anchor="middle">198 Fehlalarme</text>
    <text x="252" y="70" class="subtext" fill="#f43f5e" text-anchor="middle">2% von 9.900 Harmlosen (FP)</text>

    <!-- Summary Box -->
    <rect x="20" y="105" width="345" height="55" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="126" class="label">Gesamtzahl Alarme: 95 + 198 = <tspan fill="#f8fafc" font-weight="700">293</tspan></text>
    <text x="35" y="146" class="label">P(Betrug | Alarm) = 95 / 293 = <tspan fill="#38bdf8" font-weight="700">32.4% Posterior</tspan> (67.6% Fehlalarm!)</text>
  </g>
</svg>
