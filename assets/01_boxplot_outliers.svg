<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .box { fill: #0284c7; fill-opacity: 0.25; stroke: #38bdf8; stroke-width: 2.5; }
      .median { stroke: #f43f5e; stroke-width: 3.5; stroke-linecap: round; }
      .whisker { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4 4; }
      .whisker-end { stroke: #94a3b8; stroke-width: 2.5; stroke-linecap: round; }
      .outlier { fill: #f43f5e; stroke: #ffe4e6; stroke-width: 1.5; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #cbd5e1; text-anchor: middle; font-weight: 500; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #f8fafc; font-weight: 700; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .accent { fill: #38bdf8; font-weight: 600; }
      .iqr-brace { stroke: #38bdf8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="800" height="320" class="bg"/>
  <text x="30" y="38" class="title">Anatomie eines Boxplots &amp; IQR-Ausreißer-Erkennung</text>
  <text x="30" y="58" class="subtext">Essentiell für Data Cleaning &amp; Feature Scaling vor dem Modelltraining</text>
  
  <!-- Axis -->
  <line x1="80" y1="210" x2="730" y2="210" stroke="#334155" stroke-width="2"/>
  
  <!-- Whiskers -->
  <line x1="160" y1="140" x2="260" y2="140" class="whisker"/>
  <line x1="160" y1="110" x2="160" y2="170" class="whisker-end"/>
  
  <line x1="500" y1="140" x2="620" y2="140" class="whisker"/>
  <line x1="620" y1="110" x2="620" y2="170" class="whisker-end"/>
  
  <!-- Box (Q1 to Q3) -->
  <rect x="260" y="90" width="240" height="100" rx="4" class="box"/>
  
  <!-- Median Line -->
  <line x1="360" y1="90" x2="360" y2="190" class="median"/>
  
  <!-- Outliers -->
  <circle cx="100" cy="140" r="6" class="outlier"/>
  <circle cx="680" cy="140" r="6" class="outlier"/>
  <circle cx="715" cy="140" r="6" class="outlier"/>
  
  <!-- Labels -->
  <text x="100" y="115" class="label" fill="#f43f5e">Ausreißer</text>
  <text x="160" y="85" class="label">Untere Grenze</text>
  <text x="160" y="100" class="subtext" text-anchor="middle">Q1 - 1.5×IQR</text>
  
  <text x="260" y="70" class="label accent">Q1 (25%)</text>
  <text x="360" y="70" class="label" fill="#f43f5e">Median (50%)</text>
  <text x="500" y="70" class="label accent">Q3 (75%)</text>
  
  <text x="620" y="85" class="label">Obere Grenze</text>
  <text x="620" y="100" class="subtext" text-anchor="middle">Q3 + 1.5×IQR</text>
  
  <text x="700" y="115" class="label" fill="#f43f5e">Ausreißer</text>
  
  <!-- IQR Indicator -->
  <path d="M 260 220 L 260 235 L 380 235 L 380 245 L 380 235 L 500 235 L 500 220" class="iqr-brace"/>
  <text x="380" y="265" class="label accent">IQR = Q3 - Q1 (Mittlere 50% der Daten)</text>
  <text x="380" y="285" class="subtext" text-anchor="middle">Reagiert robust gegen Extremwerte – ideal für robustes Preprocessing im ML</text>
</svg>
