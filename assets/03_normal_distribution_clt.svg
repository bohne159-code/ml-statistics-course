<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; fill: #f8fafc; font-weight: 700; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cbd5e1; font-weight: 500; text-anchor: middle; }
      .curve { fill: none; stroke: #38bdf8; stroke-width: 3.5; stroke-linecap: round; }
      .area-1 { fill: #0284c7; fill-opacity: 0.45; }
      .area-2 { fill: #0284c7; fill-opacity: 0.25; }
      .area-3 { fill: #0284c7; fill-opacity: 0.12; }
      .grid { stroke: #334155; stroke-width: 1.5; }
      .mean-line { stroke: #f43f5e; stroke-width: 2.5; stroke-dasharray: 4 4; }
    </style>
  </defs>
  <rect width="800" height="320" class="bg"/>
  <text x="30" y="38" class="title">Die Gaußsche Normalverteilung: Die empirische 68 - 95 - 99.7% Regel</text>
  <text x="30" y="58" class="subtext">Grundlage von He/Xavier-Initialisierung, Variational Autoencoders (VAEs) und Diffusionsrauschen</text>

  <!-- Baseline Grid -->
  <line x1="80" y1="250" x2="720" y2="250" class="grid"/>

  <!-- Shaded areas under the curve -->
  <!-- 3 sigma area: x from 120 to 680 -->
  <path d="M 120 250 Q 200 248, 250 230 Q 320 200, 360 140 Q 400 80, 400 80 Q 400 80, 440 140 Q 480 200, 550 230 Q 600 248, 680 250 Z" class="area-3"/>
  <!-- 2 sigma area: x from 213 to 587 -->
  <path d="M 213 250 Q 270 240, 320 195 Q 360 140, 400 80 Q 440 140, 480 195 Q 530 240, 587 250 Z" class="area-2"/>
  <!-- 1 sigma area: x from 307 to 493 -->
  <path d="M 307 250 Q 350 200, 400 80 Q 450 200, 493 250 Z" class="area-1"/>

  <!-- Outer Bell Curve Line -->
  <path d="M 80 249 Q 150 249, 213 240 Q 300 215, 360 140 Q 400 80, 400 80 Q 400 80, 440 140 Q 500 215, 587 240 Q 650 249, 720 249" class="curve"/>

  <!-- Mean Center Line -->
  <line x1="400" y1="80" x2="400" y2="250" class="mean-line"/>

  <!-- Ticks on axis -->
  <line x1="400" y1="250" x2="400" y2="260" class="grid"/>
  <line x1="493" y1="250" x2="493" y2="260" class="grid"/>
  <line x1="587" y1="250" x2="587" y2="260" class="grid"/>
  <line x1="680" y1="250" x2="680" y2="260" class="grid"/>
  <line x1="307" y1="250" x2="307" y2="260" class="grid"/>
  <line x1="213" y1="250" x2="213" y2="260" class="grid"/>
  <line x1="120" y1="250" x2="120" y2="260" class="grid"/>

  <!-- Axis Labels -->
  <text x="120" y="278" class="label">-3σ</text>
  <text x="213" y="278" class="label">-2σ</text>
  <text x="307" y="278" class="label">-1σ</text>
  <text x="400" y="278" class="label" fill="#f43f5e" font-weight="700">μ (Mittelwert)</text>
  <text x="493" y="278" class="label">+1σ</text>
  <text x="587" y="278" class="label">+2σ</text>
  <text x="680" y="278" class="label">+3σ</text>

  <!-- Percentages -->
  <text x="400" y="175" class="label" fill="#f8fafc" font-size="14px" font-weight="700">68.2% (±1σ)</text>
  <text x="400" y="210" class="label" fill="#38bdf8" font-size="13px" font-weight="600">95.4% (±2σ)</text>
  <text x="400" y="238" class="label" fill="#94a3b8" font-size="11px">99.7% (±3σ)</text>
</svg>
